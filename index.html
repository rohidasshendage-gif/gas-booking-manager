*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;color:#17202a;font-family:Arial,sans-serif;text-transform:uppercase}
header{background:#d71920;color:#fff;padding:18px;text-align:center;font-size:22px;font-weight:800}

.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:8px;padding:11px 14px;font-weight:800}

.red{background:#ffe0e0;color:#a40000}
.blue{background:#e2ecff;color:#174ea6}
.item{border:1px solid #e0e5ea;border-radius:11px;padding:13px;margin:10px 0;background:#fafbfd}

.badge.ok{background:#dff3e5;color:#08752e}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}

.empty{text-align:center;color:#777;padding:25px}
.hidden{display:none!important}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:#fff;border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 8px #0001}

.modal{position:fixed;inset:0;background:#0008;z-index:20;padding:18px;overflow:auto}

.compact-table{width:100%;border-collapse:collapse;font-size:13px;table-layout:auto}
.compact-table th,.compact-table td{border-bottom:1px solid #e4e8ec;padding:7px 5px;text-align:left;white-space:nowrap}
.compact-table th{background:#f1f4f7;font-size:12px}

.customer-grid{display:grid;grid-template-columns:1fr;gap:7px}

 .table-wrap{margin:0 -4px;width:calc(100% + 8px)}
 .compact-table{font-size:10px;min-width:500px}
 .compact-table th,.compact-table td{padding:5px 3px}
 .compact-actions .btn{padding:5px 4px;font-size:10px}
 .otp-input{width:75px!important}
}

.tab-info{margin:4px 0 14px;line-height:1.5}
.booking-table th:nth-child(1),.booking-table td:nth-child(1){min-width:55px;width:55px}
.booking-table th:nth-child(2),.booking-table td:nth-child(2){min-width:140px}

.compact-table td{vertical-align:middle}
</style>

.stock-grid label{display:flex;flex-direction:column;gap:5px;font-weight:600}
.stock-grid input{padding:9px}
</style>

<div class="wrap">

<section id="addCustomer">

<label>CUSTOMER OTP</label><input id="editOtp" maxlength="6" inputmode="numeric"><label>GAS COMPANY</label><select id="editCompany"><option>INDANE</option><option>HP GAS</option><option>BHARATGAS</option><option>OTHER</option></select>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDlouTH9gU6eIv4Icj2EzKI-x-eeZCEcUw",
  authDomain: "gas-booking-manager.firebaseapp.com",
  projectId: "gas-booking-manager",
  storageBucket: "gas-booking-manager.firebasestorage.app",
  messagingSenderId: "475178783381",
  appId: "1:475178783381:web:2d0faf5d46dddd6158c19c",
  measurementId: "G-JWDVY5YL5V"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const CUSTOMERS_COL = "customers";
const HISTORY_COL = "history";
let cloudLoaded = false;
let cloudBusy = false;

async function loadFromFirebase(){
  try{
    const [cs, hs] = await Promise.all([
      db.collection(CUSTOMERS_COL).get(),
      db.collection(HISTORY_COL).get()
    ]);

    // Only documents created by this app are used. This safely ignores
    // any test/manual document that was created in the Firebase console.
    const cloudCustomers = cs.docs.map(d=>d.data()).filter(x=>x && x.id!=null);
    const cloudHistory = hs.docs.map(d=>d.data()).filter(x=>x && x.id!=null);

    if(cloudCustomers.length){
      data = cloudCustomers.sort((a,b)=>(b.id||0)-(a.id||0));
    } else if(data.length){
      // First-time setup: move existing local customers to Firebase.
      await syncToFirebase();
    } else {
      data = [];
    }

    if(cloudHistory.length){
      history = cloudHistory.sort((a,b)=>(b.id||0)-(a.id||0));
    }

    localStorage.setItem(DATA_KEY,JSON.stringify(data));
    localStorage.setItem(HIST_KEY,JSON.stringify(history));
    cloudLoaded = true;
    const st=document.getElementById("firebaseStatus");
    if(st){st.textContent="☁️ FIREBASE CONNECTED";st.style.background="#dff3e5";st.style.color="#08752e";}
    renderAll();
  }catch(e){
    console.error("FIREBASE LOAD ERROR",e);
    const st=document.getElementById("firebaseStatus");
    if(st){st.textContent="⚠️ FIREBASE NOT CONNECTED";st.style.background="#ffe0e0";st.style.color="#a40000";}
    alert("FIREBASE CONNECT FAILED. FIRESTORE RULES / INTERNET CHECK KARA.");
  }
}

async function syncToFirebase(deletedCustomerId=null){
  if(cloudBusy)return;
  cloudBusy=true;
  try{
    // Firestore batch limit is 500 writes. Split into safe chunks.
    const customerWrites = data.map(x=>({ref:db.collection(CUSTOMERS_COL).doc(String(x.id)),data:x}));
    const historyWrites = history.slice(0,500).map(x=>({ref:db.collection(HISTORY_COL).doc(String(x.id)),data:x}));
    if(deletedCustomerId!==null){
      customerWrites.push({ref:db.collection(CUSTOMERS_COL).doc(String(deletedCustomerId)),delete:true});
    }
    const writes=[...customerWrites,...historyWrites];
    for(let i=0;i<writes.length;i+=450){
      const batch=db.batch();
      writes.slice(i,i+450).forEach(w=>{
        if(w.delete) batch.delete(w.ref); else batch.set(w.ref,w.data);
      });
      await batch.commit();
    }
  }catch(e){
    console.error("FIREBASE SAVE ERROR",e);
    alert("FIREBASE SAVE FAILED. FIRESTORE RULES / INTERNET CHECK KARA.");
  }finally{
    cloudBusy=false;
  }
}

const DATA_KEY="GAS_CUSTOMERS_V3";
const HIST_KEY="GAS_HISTORY_V3";
let data=JSON.parse(localStorage.getItem(DATA_KEY)||"[]");
let history=JSON.parse(localStorage.getItem(HIST_KEY)||"[]");

function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(s,n){const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(s){if(!s)return "-";const a=s.split("-");return a[2]+"/"+a[1]+"/"+a[0]}
function norm(s){return String(s||"").trim().toUpperCase().replace(/\s+/g," ")}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function save(deletedCustomerId=null){
 localStorage.setItem(DATA_KEY,JSON.stringify(data));
 localStorage.setItem(HIST_KEY,JSON.stringify(history));
 renderAll();
 syncToFirebase(deletedCustomerId);
}
function showTab(id,btn){
 document.querySelectorAll("section").forEach(x=>x.classList.add("hidden"));
 const section=document.getElementById(id);
 if(section)section.classList.remove("hidden");
 document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
 if(btn)btn.classList.add("active");
 renderAll();
}
function duplicate(no,name,mobile,ignoreId=null){return data.find(x=>x.id!==ignoreId&&((no&&norm(x.customerNo)===norm(no))||(name&&norm(x.name)===norm(name))||(mobile&&norm(x.mobile)===norm(mobile))))}

function addCustomer(){
 const no=document.getElementById("customerNo").value.trim(), name=norm(document.getElementById("name").value),
 mobile=document.getElementById("mobile").value.trim(),
 company=document.getElementById("company").value, date=document.getElementById("deliveryDate").value;
 if(!no||!name||!date){alert("CUSTOMER NUMBER, CUSTOMER NAME AND DELIVERY DATE REQUIRED.");return}
 if(mobile&&!/^\d{10}$/.test(mobile)){alert("MOBILE NUMBER MUST BE 10 DIGITS.");return}
 const d=duplicate(no,name,mobile);if(d){alert("⚠️ DUPLICATE ENTRY FOUND!\nCUSTOMER NUMBER / NAME / MOBILE NUMBER PAiKI EK SAME AHE.");return}
 data.unshift({id:Date.now(),customerNo:no,name,mobile,otp:"",company,deliveryDate:date,nextDate:addDays(date,26),status:"CUSTOMER"});
 history.unshift({id:Date.now()+1,type:"CUSTOMER ADD",date:today(),customerNo:no,name,mobile});
 save();clearAdd();alert("CUSTOMER SAVED ✅");showTab("customers",document.querySelectorAll(".tabs button")[2]);
}
function clearAdd(){customerNo.value="";name.value="";mobile.value="";deliveryDate.value=today()}

async function bookingNow(id){
 const x=data.find(a=>a.id===id);if(!x)return;
 let otp=prompt("CUSTOMER OTP ENTER करा");
 if(otp===null)return;
 otp=String(otp).trim();
 if(!/^\d{4,6}$/.test(otp)){
   alert("❌ OTP ENTER KARA. OTP 4 TO 6 DIGITS ASAVA.");
   return;
 }
 const stockResult = await window.moveGasStock(-1,+1,"BOOKING");
 if(!stockResult.ok){
   alert(stockResult.message);
   return;
 }
 x.otp=otp;
 x.status="BOOKING NOW";
 x.bookingDate=today();
 history.unshift({id:Date.now(),type:"BOOKING NOW",date:today(),customerNo:x.customerNo,name:x.name,mobile:x.mobile,otp:x.otp});
 save();alert("BOOKING NOW SAVED ✅\nFULL STOCK: "+stockResult.full+"\nEMPTY STOCK: "+stockResult.empty+"\nSALE: ₹"+stockResult.sell+"\nPURCHASE: ₹"+stockResult.purchase+"\nPROFIT/LOSS: ₹"+stockResult.saleProfit);
 showTab("bookingNowTab",document.querySelectorAll(".tabs button")[4]);
}
async function deliveryNow(id){
 const x=data.find(a=>a.id===id);if(!x)return;
 const otp=prompt("CUSTOMER OTP ENTER करा");
 if(otp===null)return;
 if(String(otp).trim()!==String(x.otp||"")){alert("❌ OTP NOT MATCHED.");return}
 const stockResult = await window.moveGasStock(+1,-1,"DELIVERY");
 if(!stockResult.ok){
   alert(stockResult.message);
   return;
 }
 const d=today();
 x.deliveryDate=d;
 x.nextDate=addDays(d,26);
 x.status="CUSTOMER";
 x.bookingDate="";
 history.unshift({id:Date.now(),type:"DELIVERY DONE",date:d,customerNo:x.customerNo,name:x.name,mobile:x.mobile,otp:x.otp});
 save();
 alert("DELIVERY DONE ✅\nFULL STOCK: "+stockResult.full+"\nEMPTY STOCK: "+stockResult.empty+"\nSTOCK ADDED: ₹"+stockResult.purchase);
 showTab("bookingTab",document.querySelectorAll(".tabs button")[2]);
}
function editCustomer(id){
 const x=data.find(a=>a.id===id);if(!x)return;
 editId.value=x.id;editNo.value=x.customerNo;editName.value=x.name;editMobile.value=x.mobile||"";editCompany.value=x.company;editDate.value=x.deliveryDate||"";editOtp.value=x.otp||"";
 editModal.classList.remove("hidden");
}
function closeEdit(){editModal.classList.add("hidden")}
function saveEdit(){
 const id=Number(editId.value),no=editNo.value.trim(),name=norm(editName.value),mobile=editMobile.value.trim(),otp=editOtp.value.trim(),company=editCompany.value,date=editDate.value;
 if(!no||!name||!date){alert("REQUIRED DETAILS MISSING.");return}
 if(otp && !/^\d{4,6}$/.test(otp)){alert("OTP 4 TO 6 DIGITS ASAVA.");return}
 const d=duplicate(no,name,mobile,id);if(d){alert("⚠️ DUPLICATE ENTRY FOUND!");return}
 const x=data.find(a=>a.id===id);if(!x)return;
 x.customerNo=no;x.name=name;x.mobile=mobile;x.otp=otp;x.company=company;x.deliveryDate=date;x.nextDate=addDays(date,26);save();closeEdit();alert("CUSTOMER UPDATED ✅");
}
function del(id){if(confirm("DELETE THIS CUSTOMER?")){data=data.filter(x=>x.id!==id);save(id)}}

function deleteBookingNow(id){
 const x=data.find(a=>a.id===id);if(!x)return;
 if(!confirm("DELETE THIS BOOKING NOW ENTRY?"))return;
 x.status="CUSTOMER";
 x.bookingDate="";
 x.otp="";
 save();
 alert("BOOKING NOW ENTRY DELETED ✅");
}

function renderAll(){renderBooking();renderCustomers();renderBookingNow()}
function renderBooking(){
 const due=data.filter(x=>x.nextDate<=today()&&x.status!=="BOOKING NOW");
 const box=document.getElementById("bookingDueList");
 box.innerHTML=due.length?`<div class="table-wrap"><table class="compact-table booking-table"><thead><tr><th>S.NO.</th><th>NAME</th><th>CUSTOMER NO</th><th>BOOKING NOW</th><th>EDIT</th></tr></thead><tbody>${due.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.customerNo)}</td><td><div class="compact-actions"><button class="btn green" onclick="bookingNow(${x.id})">BOOKING NOW</button></div></td><td><div class="compact-actions"><button class="btn blue" onclick="editCustomer(${x.id})">EDIT</button></div></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">NO BOOKING DUE.</div>';
}
function renderCustomers(){
 const q=norm(document.getElementById("customerSearch")?.value||"");
 const list=data.filter(x=>!q||norm(x.name).includes(q)||norm(x.customerNo).includes(q)||norm(x.mobile).includes(q));
 document.getElementById("customerList").innerHTML=list.length?`<div class="table-wrap"><table class="compact-table"><thead><tr><th>S.NO.</th><th>NAME</th><th>CUSTOMER NO</th><th>MOBILE</th><th>ACTION</th></tr></thead><tbody>${list.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.customerNo)}</td><td>${esc(x.mobile)}</td><td><div class="compact-actions"><button class="btn blue" onclick="editCustomer(${x.id})">EDIT</button><button class="btn red" onclick="del(${x.id})">DEL</button></div></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">NO CUSTOMER FOUND.</div>';
}
function renderBookingNow(){
 const list=data.filter(x=>x.status==="BOOKING NOW").slice(0,15);
 document.getElementById("bookingNowList").innerHTML=list.length?`<div class="table-wrap"><table class="compact-table"><thead><tr><th>S.NO.</th><th>NAME</th><th>CUSTOMER NO</th><th>OTP</th><th>DELIVERY NOW</th><th>ACTION</th></tr></thead><tbody>${list.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.customerNo)}</td><td><span>${esc(x.otp)}</span></td><td><div class="compact-actions"><button class="btn green" onclick="deliveryNow(${x.id})">DELIVERY NOW</button></div></td><td><div class="compact-actions"><button class="btn blue" onclick="editCustomer(${x.id})">EDIT</button><button class="btn red" onclick="deleteBookingNow(${x.id})">DELETE</button></div></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">NO BOOKING NOW CUSTOMER.</div>';
}

document.addEventListener("input",e=>{if(e.target.matches("input[type=text],input:not([type]),input[type=tel]"))e.target.value=e.target.value.toUpperCase()});
document.getElementById("deliveryDate").value=today();
renderAll();
loadFromFirebase();
</script>

<section id="stock" class="hidden">
  <div class="card">
    <h2>STOCK</h2>
    <div class="stock-grid">
      <label>Total Gas Tank
        <input id="stockTotal" type="number" min="0" value="0">
      </label>
      <label>Full
        <input id="stockFull" type="number" min="0" value="0">
      </label>
      <label>Empty
        <input id="stockEmpty" type="number" min="0" value="0">
      </label>
      <label>Purchase Price
        <input id="purchasePrice" type="number" min="0" step="0.01" value="0">
      </label>
      <label>Sell Price
        <input id="sellPrice" type="number" min="0" step="0.01" value="0">
      </label>
      <label>Total Profit / Loss
        <input id="totalProfit" type="number" step="0.01" value="0" readonly>
      </label>
      <label>Current Full Stock Value
        <input id="currentStockValue" type="number" step="0.01" value="0" readonly>
      </label>
    </div>
    <button type="button" id="saveStock">SAVE STOCK</button>
  </div>
</section>


<script>
(function(){
  const ids = ["stockTotal","stockFull","stockEmpty","purchasePrice","sellPrice","totalProfit","currentStockValue"];

  async function loadStock(){
    try{
      const snap = await db.collection("stock").doc("STOCK_DATA").get();
      if(snap.exists){
        const d=snap.data()||{};
        ids.forEach(id=>{
          if(d[id] !== undefined && document.getElementById(id))
            document.getElementById(id).value=d[id];
        });
      }
    }catch(e){ console.error("Stock load error:",e); }
  }

  async function moveStock(fullDelta, emptyDelta, mode){
    const ref = db.collection("stock").doc("STOCK_DATA");
    let result = null;
    await db.runTransaction(async tx=>{
      const snap = await tx.get(ref);
      const d = snap.exists ? (snap.data() || {}) : {};
      const full = Number(d.stockFull || 0);
      const empty = Number(d.stockEmpty || 0);
      const purchase = Number(d.purchasePrice || 0);
      const sell = Number(d.sellPrice || 0);
      const profit = Number(d.totalProfit || 0);
      const newFull = full + fullDelta;
      const newEmpty = empty + emptyDelta;

      if(newFull < 0){
        result = {ok:false, message:"❌ FULL STOCK उपलब्ध नाही."};
        return;
      }
      if(newEmpty < 0){
        result = {ok:false, message:"❌ EMPTY STOCK उपलब्ध नाही."};
        return;
      }

      // BOOKING NOW = one full cylinder is sold.
      // Delivery NOW = returned empty is converted back to full stock.
      const saleProfit = mode === "BOOKING" ? (sell - purchase) : 0;
      const newProfit = profit + saleProfit;
      const newStockValue = newFull * purchase;

      tx.set(ref,{
        stockFull:newFull,
        stockEmpty:newEmpty,
        stockTotal:Number(d.stockTotal || 0),
        purchasePrice:purchase,
        sellPrice:sell,
        totalProfit:newProfit,
        currentStockValue:newStockValue
      },{merge:true});
      result = {ok:true, full:newFull, empty:newEmpty, profit:newProfit,
        saleProfit:saleProfit, stockValue:newStockValue, purchase:purchase, sell:sell};
    });

    if(!result || !result.ok) return result || {ok:false,message:"Stock update failed"};

    const fullEl=document.getElementById("stockFull");
    const emptyEl=document.getElementById("stockEmpty");
    const profitEl=document.getElementById("totalProfit");
    const valueEl=document.getElementById("currentStockValue");
    if(fullEl) fullEl.value=result.full;
    if(emptyEl) emptyEl.value=result.empty;
    if(profitEl) profitEl.value=result.profit;
    if(valueEl) valueEl.value=result.stockValue;
    return result;
  }

  window.moveGasStock = moveStock;

  async function saveStock(){
    const data={};
    ids.forEach(id=>{
      const el=document.getElementById(id);
      data[id]=el ? Number(el.value||0) : 0;
    });
    try{
      await db.collection("stock").doc("STOCK_DATA").set(data,{merge:true});
      alert("Stock saved successfully");
    }catch(e){
      console.error("Stock save error:",e);
      alert("Stock save failed");
    }
  }

  document.addEventListener("click",function(e){
    if(e.target && e.target.id==="saveStock") saveStock();
  });

  document.addEventListener("DOMContentLoaded",loadStock);
  loadStock();
})();
</script>

</body>
